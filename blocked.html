<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>blocked</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
    h1::after { content: ""; display: block; width: 24px; height: 2px; background: var(--accent); margin: 14px auto 0; }
    #count { margin-top: 12px; }
    #hatch { margin-top: 48px; font-size: 12px; }
    #hatch button { margin: 0 2px; }
  </style>
</head>
<body>
  <main>
    <h1 id="domain">blocked</h1>
    <p id="count" class="muted num"></p>
    <p id="hatch" class="muted" hidden>
      need it? open for
      <button data-min="5">5m</button>
      <button data-min="15">15m</button>
      <button data-min="30">30m</button>
    </p>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
