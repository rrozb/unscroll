<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 300px; padding: 14px; }
    form { display: flex; gap: 6px; }
    input {
      flex: 1; font: inherit; color: inherit; background: none;
      border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; outline: none;
    }
    input:focus { border-color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 10px 0 0; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    li .d { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    li .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
    li.open .dot { background: var(--muted); }
    .link { border: 0; padding: 0; color: var(--muted); font-size: 12px; }
    .link:hover { color: var(--fg); }
    h2 { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 6px; }
    table { width: 100%; border-collapse: collapse; }
    th { font-weight: 400; color: var(--muted); font-size: 11px; text-align: right; padding-bottom: 4px; }
    th:first-child, td:first-child { text-align: left; }
    td { text-align: right; padding: 3px 0; }
    td small { color: var(--muted); }
    .empty { color: var(--muted); padding: 8px 0; }
  </style>
</head>
<body>
  <form id="add">
    <input id="domain" placeholder="add a site, e.g. x.com" autocomplete="off" spellcheck="false">
  </form>
  <ul id="list"></ul>

  <h2>blocked tries · opens</h2>
  <table>
    <thead><tr><th></th><th>today</th><th>7 days</th><th>30 days</th></tr></thead>
    <tbody id="stats"></tbody>
  </table>
  <script type="module" src="popup.js"></script>
</body>
</html>
